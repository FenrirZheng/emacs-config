# Cargo workspace for the git helper binaries of this Emacs config.
# Each member is one bin run by a lisp/ module (and usable as a `git <name>`
# subcommand from the terminal).  They share gix, the profiles and the mold
# linker config, so the workspace compiles gix once and keeps one lockfile.
#
# Build and deploy: `make` here (see Makefile); workspace overview: README.md.

[workspace]
resolver = "3"
members = ["git-subtree-status", "git-nested-status"]

[workspace.dependencies]
gix = { version = "0.89.0", default-features = false, features = ["max-performance-safe", "sha1", "status", "revision"] }

[profile.release]
strip = true
lto = "thin"               # most of the runtime benefit at a lower build cost

[profile.dev]
debug = "line-tables-only" # readable backtraces, less to link

[profile.quick]            # local optimized runs; these three lines travel together
inherits = "release"
lto = false
codegen-units = 16
incremental = true
